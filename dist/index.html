<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#d9658c"><title>Contas &amp; Looks</title><link rel="stylesheet" href="style.css?v=31"><link rel="stylesheet" href="design-system.css?v=32"><link rel="stylesheet" href="figma-ui.css?v=20">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=19">
<meta name="apple-mobile-web-app-title" content="Contas &amp; Looks">
<link rel="icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="icons/dress-up-math-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/dress-up-math-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="icons/dress-up-math-48.png">
<link rel="manifest" href="manifest.webmanifest?v=30">
</head><body>
<div id="appViewport"><div id="appCanvas">
<header class="site-header">
  <div class="header-top">
    <a class="brand" href="./" aria-label="Contas &amp; Looks" data-i18n-skip>
      <img src="assets/logo-contas-looks.png" alt="Contas &amp; Looks" width="397" height="133">
    </a>
    <div class="header-score-group">
        <span class="score" role="status" aria-atomic="true">
          <img src="assets/figma-star.png" width="34" height="34" alt="">
          <span class="score-copy"><b id="stars">0</b></span>
        </span>
        <button class="secondary" type="button" id="closet" aria-label="Guarda-roupa" aria-haspopup="dialog">
          <img src="assets/figma-closet.png" alt="">
          <span id="count" aria-hidden="true"></span><span id="closetNews" aria-hidden="true" hidden>Novos</span>
        </button>
    </div>
    <div class="header-tools">
      <button class="secondary header-tool" type="button" id="gameHelp" aria-label="Como funciona?" title="Como funciona?" aria-haspopup="dialog">
        <img src="assets/figma-icons/question.png" width="31" height="31" alt="">
      </button>
      <button class="secondary header-tool" type="button" id="settings" aria-label="Ajustes" title="Ajustes" aria-haspopup="dialog">
        <img src="assets/figma-gear.png" width="31" height="31" alt="">
      </button>
    </div>
  </div>
</header>
<main>
  <nav id="modes" aria-label="Atividades"></nav>
  <div class="layout">
<section class="game" aria-labelledby="lesson"><div class="game-top" id="exerciseHeader"><div class="game-heading"><span class="mode-icon"><img id="exerciseIcon" width="33" height="33" alt=""></span><h2 id="lesson"></h2></div><span class="pill" id="round"></span></div><div class="play"><form id="form"><div class="exercise-layout"><div class="challenge-column"><div class="exercise-main"><div id="exercise"></div></div><div class="actions exercise-actions"><button class="primary" id="check">Responder</button></div></div><div id="keypad" class="keypad" role="group" aria-label="Teclado numérico"></div></div><div class="help-control"><button type="button" class="help" id="help" aria-label="Ajudinha" aria-haspopup="dialog"><img src="assets/figma-help-screen.png" alt=""></button><div id="helpMeter" class="help-meter" role="status" aria-atomic="true"></div></div></form><p id="feedback" role="status" aria-live="polite"></p><div id="earned" hidden></div></div></section><aside class="wardrobe"><h2 class="wardrobe-heading"><span class="dress-up-ribbon"><i class="dress-up-ribbon__tail" aria-hidden="true"></i><i class="dress-up-ribbon__tail dress-up-ribbon__tail--right" aria-hidden="true"></i><i class="dress-up-ribbon__face" aria-hidden="true"></i><b>Meu look</b></span></h2>
  <div class="doll-scene"><div class="doll" id="doll"></div></div>
</aside>
</div></main>
</div></div>
<section id="orientationPrompt" role="status" aria-live="polite"><img class="orientation-rotate-icon" src="assets/orientation-rotate.png" alt="" aria-hidden="true"><p>Vire a tela para jogar</p></section>
<div class="modal" id="modal" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="dialog-top"><span class="reward-balance" id="rewardBalance" role="status"><img src="assets/estrela-pontos.svg" alt=""><b id="rewardStars"></b></span><h2 id="dialogTitle"></h2><button class="close" id="close" aria-label="Fechar janela">×</button></div><div id="dialogBody"></div><div class="actions" id="dialogActions"></div></section></div><script src="i18n.js?v=40"></script><script src="learning.js?v=34"></script><script src="collection.js?v=4"></script><script src="wardrobe-icons.js?v=18"></script><script src="orientation.js?v=1"></script><script src="app.js?v=45"></script></body></html>
